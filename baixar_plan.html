<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exportar Família Anerão</title>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 40px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    p {
      color: #cbd5e1;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .info {
      background: rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .info strong {
      color: #ffffff;
    }

    .btn {
      border: none;
      outline: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(34,197,94,0.35);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 25px rgba(34,197,94,0.45);
    }

    .status {
      margin-top: 22px;
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .footer {
      margin-top: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 Exportador Excel</h1>

    <p>
      Baixe todos os registros do arquivo <strong>dados.json</strong>
      em uma planilha Excel profissional formatada em tabela.
    </p>

    <div class="info">
      <div><strong>Origem:</strong> https://amarildo1963.github.io/jaa/dados.json</div>
      <div><strong>Formato:</strong> Excel (.xlsx)</div>
      <div><strong>Nome do arquivo:</strong> familia-anerao.xlsx</div>
    </div>

    <button class="btn" onclick="baixarExcel()">
      ⬇️ Baixar Planilha Excel
    </button>

    <div class="status" id="status"></div>

    <div class="footer">
      Sistema Profissional de Exportação Excel
    </div>
  </div>

  <script>
    async function baixarExcel() {
      const status = document.getElementById('status');

      try {
        status.innerHTML = '⏳ Carregando dados...';

        const response = await fetch('https://amarildo1963.github.io/jaa/dados.json');

        if (!response.ok) {
          throw new Error('Erro ao carregar o arquivo JSON.');
        }

        const dados = await response.json();

        if (!Array.isArray(dados) || dados.length === 0) {
          throw new Error('Nenhum registro encontrado.');
        }

        status.innerHTML = '📄 Gerando planilha formatada...';

        const worksheet = XLSX.utils.json_to_sheet(dados);

        const headers = Object.keys(dados[0]);

        const range = XLSX.utils.decode_range(worksheet['!ref']);

        const colWidths = headers.map(header => {
          const maxLength = Math.max(
            header.length,
            ...dados.map(item => String(item[header] || '').length)
          );

          return { wch: Math.min(maxLength + 5, 50) };
        });

        worksheet['!cols'] = colWidths;

        for (let C = range.s.c; C <= range.e.c; ++C) {
          const cellAddress = XLSX.utils.encode_cell({ r: 0, c: C });

          if (worksheet[cellAddress]) {
            worksheet[cellAddress].s = {
              font: {
                bold: true,
                color: { rgb: 'FFFFFF' }
              },
              fill: {
                fgColor: { rgb: '1E3A8A' }
              },
              alignment: {
                horizontal: 'center'
              }
            };
          }
        }

        const workbook = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(workbook, worksheet, 'Familia Anerao');

        if (!worksheet['!autofilter']) {
          worksheet['!autofilter'] = {
            ref: worksheet['!ref']
          };
        }

        XLSX.writeFile(workbook, 'familia-anerao.xlsx');

        status.innerHTML = '✅ Planilha baixada com sucesso!';

      } catch (erro) {
        console.error(erro);
        status.innerHTML = '❌ ' + erro.message;
      }
    }
  </script>

</body>
</html>
