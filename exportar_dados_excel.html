<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exportador de Dados - Família Anerão</title>
    <!-- Tailwind CSS para um design profissional e limpo -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Biblioteca SheetJS para gerar arquivos Excel (.xlsx) nativos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-height-screen p-6">

    <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full border border-gray-100 text-center">
        <!-- Ícone Ilustrativo -->
        <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-emerald-100 text-emerald-600 mb-6">
            <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800 mb-2">Exportar Banco de Dados</h1>
        <p class="text-sm text-gray-500 mb-8">Clique no botão abaixo para buscar os registros atualizados e gerar a planilha da <strong>Família Anerão</strong>.</p>

        <!-- Botão de Ação -->
        <button id="btnDownload" onclick="baixarPlanilha()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer">
            <span id="btnText">Baixar Planilha Excel</span>
            <!-- Spinner de carregamento oculto por padrão -->
            <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>

        <!-- Mensagem de Feedback -->
        <p id="msgFeedback" class="mt-4 text-sm font-medium hidden"></p>
    </div>

    <script>
        async function baixarPlanilha() {
            const url = 'https://amarildo1963.github.io/jaa/dados.json';
            const btn = document.getElementById('btnDownload');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const feedback = document.getElementById('msgFeedback');

            // Estado de Carregamento
            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.innerText = 'Processando dados...';
            spinner.classList.remove('hidden');
            feedback.classList.add('hidden');

            try {
                // 1. Busca os dados do JSON
                const response = await fetch(url);
                if (!response.ok) throw new Error('Não foi possível acessar o arquivo de dados.');
                
                const dadosJson = await response.json();

                // 2. Converte o JSON para uma estrutura de tabela (Worksheet)
                // Se o JSON for uma lista de objetos, cada objeto vira uma linha e as chaves viram colunas automaticamente.
                const dataArray = Array.isArray(dadosJson) ? dadosJson : [dadosJson];
                const pastaTrabalho = XLSX.utils.book_new();
                const planilha = XLSX.utils.json_to_sheet(dataArray);

                // Adiciona a planilha criada ao arquivo
                XLSX.utils.book_append_sheet(pastaTrabalho, planilha, "Registros");

                // 3. Gera a data atual formatada (AAAAMMDD)
                const hoje = new Date();
                const ano = hoje.getFullYear();
                const mes = String(hoje.getMonth() + 1).padStart(2, '0');
                const dia = String(hoje.getDate()).padStart(2, '0');
                const dataFormatada = `${ano}${mes}${dia}`;

                const nomeArquivo = `familia_anerao_${dataFormatada}.xlsx`;

                // 4. Dispara o download automático do arquivo Excel
                XLSX.writeFile(pastaTrabalho, nomeArquivo);

                // Feedback de Sucesso
                feedback.innerText = "✓ Planilha gerada com sucesso!";
                feedback.className = "mt-4 text-sm font-medium text-emerald-600 block";

            } catch (error) {
                console.error(error);
                // Feedback de Erro
                feedback.innerText = "✕ Erro ao baixar ou processar os dados.";
                feedback.className = "mt-4 text-sm font-medium text-red-600 block";
            } finally {
                // Restaura o estado do botão
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.innerText = 'Baixar Planilha Excel';
                spinner.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
