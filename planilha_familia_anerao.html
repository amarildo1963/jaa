<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Baixar Planilha Excel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
}

.container{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;
    padding:40px 30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:2rem;
    font-weight:700;
    margin-bottom:10px;
    color:#ffffff;
}

.header p{
    font-size:0.95rem;
    color:#cbd5e1;
    line-height:1.7;
}

.info-box{
    background:rgba(255,255,255,0.08);
    border-radius:16px;
    padding:20px;
    margin-bottom:30px;
    border-left:5px solid #22c55e;
}

.info-box h2{
    font-size:1.1rem;
    margin-bottom:10px;
    color:#4ade80;
}

.info-box p{
    color:#e2e8f0;
    font-size:0.95rem;
    line-height:1.6;
}

.btn-area{
    display:flex;
    justify-content:center;
    margin-bottom:30px;
}

button{
    border:none;
    outline:none;
    cursor:pointer;
    padding:18px 32px;
    border-radius:16px;
    font-size:1rem;
    font-weight:600;
    transition:0.3s;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    color:#fff;
    box-shadow:0 10px 25px rgba(34,197,94,0.4);
}

button:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 14px 30px rgba(34,197,94,0.5);
}

.status{
    margin-top:20px;
    text-align:center;
    font-size:0.95rem;
    color:#f1f5f9;
}

.footer{
    margin-top:35px;
    text-align:center;
    color:#94a3b8;
    font-size:0.85rem;
    line-height:1.8;
}

.loading{
    display:none;
    text-align:center;
    margin-top:25px;
}

.spinner{
    width:55px;
    height:55px;
    border:5px solid rgba(255,255,255,0.2);
    border-top:5px solid #22c55e;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@media(max-width:600px){

    .container{
        padding:30px 20px;
    }

    .header h1{
        font-size:1.5rem;
    }

    button{
        width:100%;
        font-size:0.95rem;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 BAIXAR PLANILHA EXCEL</h1>
        <p>
            Sistema profissional para exportação de dados JSON em formato Excel XLSX
        </p>
    </div>

    <div class="info-box">
        <h2>📌 Informações</h2>
        <p>
            <strong>Autor:</strong> José Amarildo Anerão<br>
            <strong>Versão:</strong> 1.00<br>
            <strong>Última Atualização:</strong> 21/05/2026
        </p>
    </div>

    <div class="btn-area">
        <button onclick="baixarExcel()">
            ⬇️ BAIXAR PLANILHA EXCEL
        </button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p style="margin-top:15px;">Gerando planilha Excel...</p>
    </div>

    <div class="status" id="status"></div>

    <div class="footer">
        Dados carregados automaticamente de:<br>
        https://amarildo1963.github.io/jaa/dados.json
    </div>

</div>

<script>
async function baixarExcel(){

    const status = document.getElementById('status');
    const loading = document.getElementById('loading');

    try{
        loading.style.display = 'block';
        status.innerHTML = '';

        const response = await fetch('https://amarildo1963.github.io/jaa/dados.json');

        if(!response.ok){
            throw new Error('Erro ao carregar os dados JSON.');
        }

        const dados = await response.json();

        if(!Array.isArray(dados) || dados.length === 0){
            throw new Error('Nenhum registro encontrado.');
        }

        const workbook = XLSX.utils.book_new();
        const worksheet = XLSX.utils.json_to_sheet(dados);
        const colunas = Object.keys(dados[0]);

        // Ativar filtros automáticos
        worksheet['!autofilter'] = {
            ref: XLSX.utils.encode_range({
                s:{r:0,c:0},
                e:{r:dados.length,c:colunas.length-1}
            })
        };

        // Auto-ajuste de largura das colunas
        worksheet['!cols'] = colunas.map(col => ({
            wch: Math.max(col.length + 5, 20)
        }));

        const range = XLSX.utils.decode_range(worksheet['!ref']);

        // 1. Estilização do Cabeçalho (Linha 0): Fundo Preto, Letras Brancas em Negrito
        for(let C = range.s.c; C <= range.e.c; ++C){
            const endereco = XLSX.utils.encode_cell({r:0,c:C});
            if(!worksheet[endereco]) continue;

            worksheet[endereco].s = {
                font: {
                    name: "Arial",
                    sz: 11,
                    bold: true,
                    color: { rgb: "FFFFFF" }
                },
                fill: {
                    type: "pattern",
                    pattern: "solid",
                    fgColor: { rgb: "000000" } // Fundo Preto
                },
                alignment: {
                    horizontal: "center",
                    vertical: "center"
                },
                border: {
                    top: { style: "thin", color: { rgb: "333333" } },
                    bottom: { style: "medium", color: { rgb: "333333" } },
                    left: { style: "thin", color: { rgb: "333333" } },
                    right: { style: "thin", color: { rgb: "333333" } }
                }
            };
        }

        // 2. Estilização dos Dados (Linhas Alternadas: Verde Claro e Branco)
        for(let R = 1; R <= range.e.r; ++R){
            for(let C = range.s.c; C <= range.e.c; ++C){
                const endereco = XLSX.utils.encode_cell({r:R,c:C});
                if(!worksheet[endereco]) continue;

                // Define cor verde bem suave para linhas pares, e branco puro para ímpares
                const corFundo = (R % 2 === 0) ? "E2EFDA" : "FFFFFF"; 

                worksheet[endereco].s = {
                    font: {
                        name: "Arial",
                        sz: 11
                    },
                    fill: {
                        type: "pattern",
                        pattern: "solid",
                        fgColor: { rgb: corFundo }
                    },
                    alignment: {
                        horizontal: "left",
                        vertical: "center"
                    },
                    border: {
                        top: { style: "thin", color: { rgb: "D9D9D9" } },
                        bottom: { style: "thin", color: { rgb: "D9D9D9" } },
                        left: { style: "thin", color: { rgb: "D9D9D9" } },
                        right: { style: "thin", color: { rgb: "D9D9D9" } }
                    }
                };
            }
        }

        XLSX.utils.book_append_sheet(workbook, worksheet, "FAMILIA ANERAO");

        const hoje = new Date();
        const dataAtual =
            hoje.getFullYear().toString() +
            String(hoje.getMonth()+1).padStart(2,'0') +
            String(hoje.getDate()).padStart(2,'0');

        XLSX.writeFile(workbook, `planilha_fam_anerao_${dataAtual}.xlsx`);

        loading.style.display = 'none';
        status.innerHTML = '✅ Planilha Excel gerada com sucesso!';

    }catch(error){
        loading.style.display = 'none';
        status.innerHTML = '❌ ' + error.message;
        console.error(error);
    }
}
</script>

</body>
</html>
